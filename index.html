<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Page metadata -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Username & Password Input</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- External stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen bg-white flex flex-col justify-start items-start px-12 py-16 gap-2">

  <!-- ===== USERNAME FIELD ===== -->
  <div class="w-full max-w-md">
    <!-- Label -->
    <label for="usernameInput" class="block text-2xl font-semibold text-gray-800 mb-2">
      Username:
    </label>
    <!-- Text input for username -->
    <input
      id="usernameInput"
      type="text"
      class="input-field w-full border-2 border-gray-400 rounded px-4 py-3 text-2xl focus:outline-none focus:border-indigo-500"
    />
  </div>

  <!-- ===== PASSWORD FIELD ===== -->
  <div class="w-full max-w-md">
    <!-- Label -->
    <label for="passwordInput" class="block text-2xl font-semibold text-gray-800 mb-2">
      Password:
    </label>
    <!-- Password input (characters hidden) -->
    <input
      id="passwordInput"
      type="password"
      class="input-field w-full border-2 border-gray-400 rounded px-4 py-3 text-2xl focus:outline-none focus:border-indigo-500"
    />
  </div>

  <!-- ===== SUBMIT BUTTON ===== -->
  <!-- Calls handleSubmit() on click; logs values to the browser console -->
  <button
    onclick="handleSubmit()"
    class="w-full max-w-md bg-gray-200 hover:bg-gray-300 border border-gray-400 text-3xl font-semibold py-4 rounded transition"
  >
    Submit
  </button>

  <!-- External JavaScript -->
  <script src="script.js"></script>
</body>
</html>
